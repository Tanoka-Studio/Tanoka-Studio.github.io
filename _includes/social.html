{% if site.data.social %}
<socials>
    {% assign sm = site.data.social %}
    {% for entry in sm %}
        {% assign key = entry | first %}
        {% if sm[key].id %}
            <a href="{{ sm[key].href }}{{ sm[key].id }}" 
            title="{{ sm[key].title }}">
            <i class="{{ sm[key].fa-icon }}"></i></a>
        {% endif %}
    {% endfor %}
</socials>
{% endif %}
